<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .s { stroke: #333; }
    @media (prefers-color-scheme: dark) { .s { stroke: #eee; } }
    @keyframes grow {
      0% { stroke-dasharray: 0 420; opacity: 0; }
      10% { opacity: 1; }
      40%, 85% { stroke-dasharray: 420 0; }
      95%, 100% { stroke-dasharray: 0 420; }
    }
    .s { animation: grow 10s ease infinite; }
  </style>
